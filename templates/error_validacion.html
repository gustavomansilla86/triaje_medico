<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error de Validación</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="container">
    <div class="card">

        <h1>Error en los datos ingresados</h1>

        <div class="warning">
            Algunos valores ingresados no son válidos.
            Revise los datos e intente nuevamente.
        </div>

        <ul>
            {% for error in errores %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>

        <a href="/" class="back-button">
            Volver al formulario
        </a>

    </div>
</div>

</body>
</html>
